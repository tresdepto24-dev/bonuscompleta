<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Páginas Bronceadas — Directorio VentaniYA! 2026</title>
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&family=Special+Elite&family=Orbitron:wght@700&display=stylesheet" rel="stylesheet">
    <style>
        body {
            font-family: 'Courier Prime', monospace;
            background-color: #2b1d11;
            color: #2c1810;
            margin: 0;
            padding: 4px;
            display: flex;
            justify-content: center;
        }
        .libro-container {
            width: 100%;
            max-width: 480px;
            background: #f4ebd0;
            border: 3px solid #4a2e18;
            padding: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.7);
            border-radius: 4px;
            box-sizing: border-box;
        }
        .header-guia {
            text-align: center;
            border-bottom: 2px dashed #4a2e18;
            padding-bottom: 6px;
            margin-bottom: 8px;
        }
        .header-guia h1 {
            font-family: 'Special Elite', cursive;
            font-size: 1rem;
            margin: 0;
            color: #2c1810;
            letter-spacing: 0.5px;
        }
        .header-guia p {
            font-size: 0.65rem;
            margin: 2px 0 0 0;
            color: #5c3a21;
        }
        .grilla-directorio {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 6px;
        }
        .casilla {
            background: #fdfbf7;
            border: 2px solid #5c3a21;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            font-size: 0.6rem;
            box-shadow: 1px 1px 3px rgba(0,0,0,0.1);
            border-radius: 2px;
        }
        .casilla.interactiva-1 {
            background: #faedcd;
            border: 2px dashed #0096c7;
        }
        .casilla.interactiva-2 {
            background: #faedcd;
            border: 2px dashed #bc6c25;
        }
        .casilla-titulo {
            font-family: 'Special Elite', cursive;
            font-size: 0.6rem;
            text-align: center;
            border-bottom: 1px solid #5c3a21;
            padding-bottom: 2px;
            margin-bottom: 3px;
        }
        .casilla-img-container {
            width: 100%;
            height: 85px;
            background: #2b1d11; 
            border: 1px solid #5c3a21;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        .casilla-img-container img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        .casilla-img-placeholder {
            color: #f4ebd0;
            font-size: 0.55rem;
            text-align: center;
        }
        .casilla-datos {
            margin-top: 3px;
            line-height: 1.15;
            word-break: break-word;
        }
        .btn-accion-mini {
            background: #5c3a21;
            color: #f4ebd0;
            border: none;
            font-family: 'Special Elite', cursive;
            font-size: 0.55rem;
            padding: 4px;
            cursor: pointer;
            margin-top: 3px;
            width: 100%;
            border-radius: 2px;
        }
        .btn-accion-mini:hover {
            background: #7c4e31;
        }
        input[type="text"] {
            width: 100%;
            font-size: 0.55rem;
            padding: 3px;
            margin-top: 2px;
            box-sizing: border-box;
            background: #fff;
            border: 1px solid #5c3a21;
            font-family: 'Courier Prime', monospace;
        }
        .modo-edicion {
            display: none;
            background: #f0e2c8;
            padding: 3px;
            border: 1px dashed #5c3a21;
            margin-top: 2px;
        }
        .footer-guia {
            text-align: center;
            margin-top: 10px;
            font-size: 0.6rem;
            border-top: 2px dashed #4a2e18;
            padding-top: 5px;
            color: #5c3a21;
        }
        #canvas-output { display: none; }
    </style>
</head>
<body>

    <div class="libro-container">
        <div class="header-guia">
            <h1>PÁGINAS BRONCEADAS — DIRECTORIO 2026</h1>
            <p id="estado-conexion">Conectando a Realtime Database...</p>
        </div>

        <div class="grilla-directorio" id="grilla-completa">
            
            <!-- Casillero 1: Vía del Milisegundo -->
            <div class="casilla interactiva-1">
                <div class="casilla-titulo" style="color:#0077b6;">Vía del Milisegundo</div>
                <div class="casilla-img-container" id="img-container-0">
                    <span class="casilla-img-placeholder" id="lbl-ph-0">[ Subir Foto ]</span>
                </div>
                <input type="text" id="text-0" placeholder="Título / Anuncio..." onchange="guardarEnRealtimeDB(0)">
                <div class="casilla-datos">
                    <strong>ID:</strong> REF-2026-X01<br>
                    <strong>GEO:</strong> MDP
                </div>
                <input type="file" accept="image/*" style="font-size:0.45rem; margin-top:2px;" onchange="procesarYSubirImagen(event, 0)">
                <button class="btn-accion-mini" style="background:#0077b6;" onclick="descargarMilisegundo(0)">💾 Descargar HD</button>
            </div>

            <!-- Casillero 2: Sello Atómico VentaniYA! MDP 1001 -->
            <div class="casilla interactiva-2">
                <div class="casilla-titulo" style="color:#bc6c25;">Sello Atómico 1001</div>
                <div class="casilla-img-container" id="img-container-1">
                    <span class="casilla-img-placeholder" id="lbl-ph-1">[ Subir Foto ]</span>
                </div>
                <input type="text" id="text-1" placeholder="Título / Anuncio..." onchange="guardarEnRealtimeDB(1)">
                <div class="casilla-datos">
                    <strong>ID:</strong> MDP-1001-X02<br>
                    <strong>GEO:</strong> MDP
                </div>
                <input type="file" accept="image/*" style="font-size:0.45rem; margin-top:2px;" onchange="procesarYSubirImagen(event, 1)">
                <button class="btn-accion-mini" style="background:#bc6c25;" onclick="descargarAtomico(1)">💾 Descargar HD</button>
            </div>

            <!-- Casilleros 3 al 10: Avisos comerciales -->
            <script>
                for(let i = 2; i < 10; i++) {
                    let numID = "2026-X0" + (i + 1);
                    document.write(`
                        <div class="casilla">
                            <div class="casilla-titulo">Aviso Comercial</div>
                            <div class="casilla-img-container" id="img-container-${i}">
                                <span class="casilla-img-placeholder" id="lbl-ph-${i}">[ Espacio Libre ]</span>
                            </div>
                            
                            <!-- Vista Estática de Texto -->
                            <div id="vista-txt-${i}" class="casilla-datos">
                                <strong id="lbl-title-${i}">Aviso ${i-1}</strong><br>
                                <span id="lbl-desc-${i}" style="color:#5c3a21;">Oferta Especial</span><br>
                                <strong>ID:</strong> ${numID}
                            </div>

                            <!-- Panel Oculto para Modificar -->
                            <div id="panel-edit-${i}" class="modo-edicion">
                                <input type="text" id="fijo-title-${i}" value="Aviso ${i-1}" placeholder="Título...">
                                <input type="text" id="fijo-desc-${i}" value="Oferta Especial" placeholder="Detalle / Monto...">
                            </div>

                            <input type="file" accept="image/*" style="font-size:0.4rem; margin-top:2px;" onchange="procesarYSubirImagen(event, ${i})">
                            
                            <button class="btn-accion-mini" id="btn-edit-${i}" style="background:#a68a67;" onclick="toggleEdicion(${i}, '${numID}')">✏️ Editar</button>
                            <button class="btn-accion-mini" style="background:#5c3a21;" onclick="descargarFijo(${i}, '${numID}')">💾 Descargar HD</button>
                        </div>
                    `);
                }
            </script>
        </div>

        <div class="footer-guia">
            © 2026 BonusYA! VentaniYA! MDP — Realtime Database Activo
        </div>
    </div>

    <canvas id="canvas-output" width="800" height="600"></canvas>

    <!-- Conexión Oficial a Firebase Realtime Database -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCQEQ21YmByod4CUYpLPnvyiyK_yPAS76w",
            authDomain: "bonuscompletaya.firebaseapp.com",
            databaseURL: "https://bonuscompletaya-default-rtdb.firebaseio.com",
            projectId: "bonuscompletaya",
            storageBucket: "bonuscompletaya.firebasestorage.app",
            messagingSenderId: "562867496314",
            appId: "1:562867496314:web:3e8de6853e4a959c24a2c3",
            measurementId: "G-6SVQK80K0R"
        };

        const app = initializeApp(firebaseConfig);
        const database = getDatabase(app);
        
        window.dbRef = ref;
        window.dbSet = set;
        window.dbGet = get;
        window.dbChild = child;
        window.database = database;

        document.getElementById('estado-conexion').innerText = "BonusYA! VentaniYA! MDP — Nube Realtime Conectada";
        
        // Cargar todo desde Realtime Database al iniciar
        cargarDatosRealtimeDB();
    </script>

    <script>
        let imagenesCargadas = {};
        let estadosEdicion = {};

        // Guardar en Realtime Database
        async function guardarEnRealtimeDB(index) {
            try {
                let titulo = "";
                let desc = "";
                let msgTxt = "";

                if(index === 0 || index === 1) {
                    msgTxt = document.getElementById(`text-${index}`).value;
                } else {
                    titulo = document.getElementById(`fijo-title-${index}`).value;
                    desc = document.getElementById(`fijo-desc-${index}`).value;
                }

                let imgUrl = imagenesCargadas[index] || "";

                const casillaRef = window.dbRef(window.database, 'directorio/casilla_' + index);
                await window.dbSet(casillaRef, {
                    titulo: titulo,
                    desc: desc,
                    msg: msgTxt,
                    imagen: imgUrl
                });

                console.log(`Casilla ${index} guardada en Realtime DB.`);
            } catch (err) {
                console.error("Error al guardar en Realtime DB:", err);
            }
        }

        // Cargar desde Realtime Database al hacer F5
        async function cargarDatosRealtimeDB() {
            try {
                const dbRef = window.dbRef(window.database);
                const snapshot = await window.dbGet(window.dbChild(dbRef, 'directorio'));
                
                if (snapshot.exists()) {
                    const dataGlobal = snapshot.val();
                    
                    for(let i = 0; i < 10; i++) {
                        const data = dataGlobal[`casilla_${i}`];
                        if (!data) continue;

                        if(i === 0 || i === 1) {
                            if(data.msg) document.getElementById(`text-${i}`).value = data.msg;
                        } else {
                            if(data.titulo) {
                                document.getElementById(`fijo-title-${i}`).value = data.titulo;
                                document.getElementById(`lbl-title-${i}`).innerText = data.titulo;
                            }
                            if(data.desc) {
                                document.getElementById(`fijo-desc-${i}`).value = data.desc;
                                document.getElementById(`lbl-desc-${i}`).innerText = data.desc;
                            }
                        }

                        if(data.imagen) {
                            imagenesCargadas[i] = data.imagen;
                            const container = document.getElementById(`img-container-${i}`);
                            container.innerHTML = '';
                            const tagImg = document.createElement('img');
                            tagImg.src = data.imagen;
                            container.appendChild(tagImg);
                        }
                    }
                }
                console.log("Datos sincronizados desde Realtime DB con éxito.");
            } catch (err) {
                console.error("Error cargando de Realtime DB:", err);
            }
        }

        // Procesar y comprimir imagen para subirla sin problemas de peso
        function procesarYSubirImagen(event, index) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    
                    const MAX_WIDTH = 600;
                    const scaleSize = MAX_WIDTH / img.width;
                    canvas.width = MAX_WIDTH;
                    canvas.height = img.height * (scaleSize < 1 ? scaleSize : 1);

                    if (scaleSize < 1) {
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    } else {
                        ctx.drawImage(img, 0, 0);
                    }

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                    imagenesCargadas[index] = dataUrl;

                    const container = document.getElementById(`img-container-${index}`);
                    container.innerHTML = '';
                    const tagImg = document.createElement('img');
                    tagImg.src = dataUrl;
                    container.appendChild(tagImg);

                    guardarEnRealtimeDB(index);
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function toggleEdicion(index, idReg) {
            const panel = document.getElementById(`panel-edit-${index}`);
            const vista = document.getElementById(`vista-txt-${index}`);
            const btn = document.getElementById(`btn-edit-${index}`);
            
            let editando = estadosEdicion[index] || false;

            if (!editando) {
                panel.style.display = 'block';
                vista.style.display = 'none';
                btn.innerText = '💾 Guardar';
                btn.style.background = '#bc6c25';
                estadosEdicion[index] = true;
            } else {
                const nuevoTitulo = document.getElementById(`fijo-title-${index}`).value;
                const nuevoDesc = document.getElementById(`fijo-desc-${index}`).value;

                document.getElementById(`lbl-title-${index}`).innerText = nuevoTitulo;
                document.getElementById(`lbl-desc-${index}`).innerText = nuevoDesc;

                panel.style.display = 'none';
                vista.style.display = 'block';
                btn.innerText = '✏️ Editar';
                btn.style.background = '#a68a67';
                estadosEdicion[index] = false;

                guardarEnRealtimeDB(index);
            }
        }

        function descargarMilisegundo(index) {
            const imgSrc = imagenesCargadas[index];
            if (!imgSrc) { alert("Primero subí una foto en este casillero."); return; }

            const imgUser = new Image();
            imgUser.onload = function() {
                const canvas = document.getElementById('canvas-output');
                const ctx = canvas.getContext('2d');
                const ahora = new Date();
                const timestamp = ahora.toLocaleDateString() + ' ' + ahora.toLocaleTimeString() + '.' + String(ahora.getMilliseconds()).padStart(3, '0');
                const msgUsuario = document.getElementById('text-0').value;
                const hashUnico = 'HASH-' + Math.random().toString(36).substring(2, 9).toUpperCase();

                ctx.fillStyle = '#1a1008';
                ctx.fillRect(0, 0, 800, 600);
                dibujarImagenContain(ctx, imgUser, 50, 80, 700, 360);

                ctx.shadowBlur = 10;
                ctx.shadowColor = "#00f2ff";
                ctx.fillStyle = "#00f2ff";
                ctx.font = 'bold 28px "Orbitron", sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText("VÍA DEL MILISEGUNDO", 400, 45);

                ctx.font = '16px "Courier Prime", monospace';
                ctx.fillText(timestamp, 400, 68);

                if(msgUsuario) {
                    ctx.font = 'italic 16px "Courier Prime", monospace';
                    ctx.fillStyle = "#ffffff";
                    ctx.shadowBlur = 0;
                    ctx.fillText(`"${msgUsuario}"`, 400, 475);
                }

                ctx.font = '14px "Courier Prime", monospace';
                ctx.fillStyle = "#ffffff";
                ctx.fillText(`ID: REF-2026-X01 | ${hashUnico} | MAR DEL PLATA`, 400, 575);

                ctx.strokeStyle = "#00f2ff";
                ctx.lineWidth = 3;
                ctx.strokeRect(15, 15, 770, 570);

                dispararDescarga(canvas, 'Estampa_Via_Milisegundo.png');
            }
            imgUser.src = imgSrc;
        }

        function descargarAtomico(index) {
            const imgSrc = imagenesCargadas[index];
            if (!imgSrc) { alert("Primero subí una foto en este casillero."); return; }

            const imgUser = new Image();
            imgUser.onload = function() {
                const canvas = document.getElementById('canvas-output');
                const ctx = canvas.getContext('2d');
                const ahora = new Date().toLocaleDateString();
                const msgUsuario = document.getElementById('text-1').value;

                ctx.fillStyle = '#f4ebd0';
                ctx.fillRect(0, 0, 800, 600);
                dibujarImagenContain(ctx, imgUser, 50, 45, 700, 370);

                ctx.strokeStyle = '#bc6c25';
                ctx.lineWidth = 6;
                ctx.strokeRect(35, 30, 730, 540);

                ctx.fillStyle = '#2c1810';
                ctx.font = 'bold 20px "Special Elite", cursive';
                ctx.textAlign = 'center';
                ctx.fillText("VENTANIYA! MDP 1001 — SELLO ATÓMICO", 400, 450);

                if(msgUsuario) {
                    ctx.font = 'italic 16px "Courier Prime", monospace';
                    ctx.fillText(`"${msgUsuario}"`, 400, 485);
                }

                ctx.font = '14px "Courier Prime", monospace';
                ctx.fillText(`REGISTRO: MDP-1001-X02 | FECHA: ${ahora} | MAR DEL PLATA`, 400, 535);

                dispararDescarga(canvas, 'Sello_Atomico_VentaniYA_1001.png');
            }
            imgUser.src = imgSrc;
        }

        function descargarFijo(index, idReg) {
            const canvas = document.getElementById('canvas-output');
            const ctx = canvas.getContext('2d');
            const imgSrc = imagenesCargadas[index];
            const titulo = document.getElementById(`fijo-title-${index}`).value || "Aviso Comercial";
            const detalle = document.getElementById(`fijo-desc-${index}`).value || "Beneficio BonusYA!";

            ctx.fillStyle = '#f4ebd0';
            ctx.fillRect(0, 0, 800, 600);

            ctx.strokeStyle = '#5c3a21';
            ctx.lineWidth = 6;
            ctx.strokeRect(40, 40, 720, 520);

            if (imgSrc) {
                const imgPersonalizada = new Image();
                imgPersonalizada.onload = function() {
                    dibujarImagenContain(ctx, imgPersonalizada, 70, 70, 660, 310);
                    terminarCanvasFijo(ctx, titulo, detalle, idReg, canvas);
                }
                imgPersonalizada.src = imgSrc;
            } else {
                ctx.fillStyle = '#e3d2b0';
                ctx.fillRect(80, 70, 640, 310);
                ctx.strokeStyle = '#5c3a21';
                ctx.lineWidth = 2;
                ctx.strokeRect(80, 70, 640, 310);

                ctx.fillStyle = '#2c1810';
                ctx.font = 'bold 28px "Special Elite", cursive';
                ctx.textAlign = 'center';
                ctx.fillText(titulo.toUpperCase(), 400, 180);

                ctx.font = 'italic 20px "Courier Prime", monospace';
                ctx.fillText(detalle, 400, 250);

                terminarCanvasFijo(ctx, titulo, detalle, idReg, canvas);
            }
        }

        function terminarCanvasFijo(ctx, titulo, detalle, idReg, canvas) {
            ctx.fillStyle = '#2c1810';
            ctx.font = 'bold 16px "Courier Prime", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`${titulo} — ${detalle}`, 400, 430);

            ctx.font = '14px "Courier Prime", monospace';
            ctx.fillText(`ID DE REGISTRO: ${idReg} | MAR DEL PLATA`, 400, 470);

            ctx.font = '12px "Special Elite", cursive';
            ctx.fillText("BonusYA! VentaniYA! MDP — Derechos Reservados", 400, 510);

            dispararDescarga(canvas, `Aviso_${idReg}.png`);
        }

        function dibujarImagenContain(ctx, img, x, y, anchoMax, altoMax) {
            const hRatio = anchoMax / img.width;
            const vRatio = altoMax / img.height;
            const ratio = Math.min(hRatio, vRatio);
            const centroX = x + (anchoMax - img.width * ratio) / 2;
            const centroY = y + (altoMax - img.height * ratio) / 2;
            ctx.drawImage(img, 0, 0, img.width, img.height, centroX, centroY, img.width * ratio, img.height * ratio);
        }

        function dispararDescarga(canvas, nombreArchivo) {
            const link = document.createElement('a');
            link.download = nombreArchivo;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
