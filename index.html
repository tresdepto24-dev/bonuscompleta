    <div class="casilla-titulo" style="color:#bc6c25;">VentaniYA! Universos</div>
    <div class="casilla-img" id="img-slot-1">[ Subir Foto ]</div>
    <!-- Campo de texto para el usuario -->
    <input type="text" id="text-1" placeholder="Escribí tu mensaje aquí..." style="width:90%; font-size:0.6rem; margin-top:5px;">
    
    <div class="casilla-datos">
        <strong>ID:</strong> REF-2026-X02<br>

    </div>
    <input type="file" id="file-1" accept="image/*" style="font-size:0.5rem; margin-top:4px;" onchange="alojarImagen(event, 1)">

<!-- Para los 8 fijos, agregamos un input file oculto o visible para que subas tu PNG -->
<script>
    // ... (dentro del bucle for de los fijos)
    document.write(`
        <div class="casilla">
            <div class="casilla-titulo">Aviso Destacado</div>
            <div class="casilla-img" id="fijo-img-${i}" style="background: #e3d2b0;">${guiasFijas[i].titulo}</div>
            <input type="file" accept="image/*" onchange="subirAvisoFijo(event, ${i})" style="font-size:0.5rem; margin-top:4px;">
            <button class="btn-accion-mini" style="background:#8c7b6c;" onclick="descargarFijo('${guiasFijas[i].titulo}', '${numID}', ${i})">💾 Descargar</button>
        </div>
    `);
</script>

<script>
    // Nueva función para subir el aviso PNG
    function subirAvisoFijo(event, index) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = function(e) {
            const slot = document.getElementById(`fijo-img-${index}`);
            slot.style.backgroundImage = `url(${e.target.result})`;
            slot.innerText = ''; // Limpia el texto
            slot.dataset.imgSrc = e.target.result; // Guardamos la imagen
        }
        reader.readAsDataURL(file);
    }

    // Ajuste en la descarga del Vintage (ahora con fecha y texto)
    function descargarVintage(index) {
        const imgUser = imagenesSubidas[index];
        const textoUsuario = document.getElementById('text-1').value;
        if (!imgUser) { alert("Subí una foto primero."); return; }

        const canvas = document.getElementById('canvas-output');
        const ctx = canvas.getContext('2d');
        const ahora = new Date().toLocaleDateString();

        ctx.fillStyle = '#f4ebd0';
        ctx.fillRect(0, 0, 800, 600);
        ctx.drawImage(imgUser, 50, 50, 700, 400);

        ctx.fillStyle = '#2c1810';
        ctx.font = 'bold 24px "Special Elite", cursive';
        ctx.fillText("VENTANIYA! — AL UNIVERSO DE OTROS MUNDOS", 400, 480);
        
        ctx.font = '20px "Courier Prime", monospace';
        ctx.fillText(ahora + " | " + textoUsuario, 400, 520); // Aquí entra el texto del usuario

        ctx.strokeStyle = '#5c3a21';
        ctx.lineWidth = 6;
        ctx.strokeRect(35, 35, 730, 530);

        dispararDescarga(canvas, 'Estampa_Vintage_Personalizada.png');
    }
</script>
